name: Site

# Publishes site/ to GitHub Pages. The browser checks gate every deploy, and
# pull requests that touch the site run the same checks without deploying.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A newer push queues behind a running deploy rather
# than cancelling it, so Pages never ends up half-published.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Browser checks
        run: node site/check.cjs

      - name: Keep screenshots from this run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-screenshots
          path: site/screenshots/
          if-no-files-found: ignore

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish only what the page serves -- not the test script or README.
      - name: Collect the site
        run: |
          mkdir _site
          cp site/index.html site/styles.css site/app.js site/curriculum.js _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
