name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests evals examples

      - name: Type check
        run: mypy

      # The suite drives the loop through a scripted backend, so it needs no
      # API key and makes no network calls.
      - name: Test
        run: pytest --cov=agent_harness --cov-report=term-missing

      - name: Offline demo
        run: python examples/offline_demo.py
